    <!-- Dynamic Social Share & OpenGraph Metadata Engine -->
    <script>
      (function() {
        var DEFAULT_TITLE = "Alfreelnc Design Portofolio – Jasa Desain Grafis & Poster Kreatif";
        var DEFAULT_DESC = "Alfreelnc Design Portofolio karya Albian (Muhammad Albiansyah) – Jasa desain grafis profesional, portofolio design graphic, jasa buat poster, jasa mengedit poster, jasa tugas, agensi desain grafis, agensi joki tugas, dan freelance desain grafis.";
        var DEFAULT_IMG = "/images/hero-albi.png";
        var DEFAULT_ALT = "Muhammad Albiansyah - Graphic Designer & UI/UX Specialist Portfolio";

        function toAbsoluteUrl(path) {
          if (!path) return '';
          if (path.indexOf('http://') === 0 || path.indexOf('https://') === 0) return path;
          var origin = window.location.origin || (window.location.protocol + '//' + window.location.host);
          var clean = path.charAt(0) === '/' ? path : '/' + path;
          return origin + clean;
        }

        function setAttr(selector, attr, value) {
          if (!value) return;
          try {
            var el = document.getElementById(selector) || document.querySelector(selector);
            if (el) el.setAttribute(attr, value);
          } catch (e) {}
        }

        // Global helper yang dapat dipanggil baik oleh script head maupun komponen React
        window.__updateSocialMeta = function(opts) {
          try {
            var hasProj = Boolean(opts && (opts.title || opts.project));
            var title = hasProj && opts.title ? opts.title : DEFAULT_TITLE;
            var description = hasProj && opts.description ? opts.description : DEFAULT_DESC;
            var rawImage = hasProj && opts.image ? opts.image : DEFAULT_IMG;
            var image = toAbsoluteUrl(rawImage);
            var url = opts && opts.url ? toAbsoluteUrl(opts.url) : (window.location.origin + window.location.pathname + window.location.search);
            var imageAlt = (hasProj && opts.project && opts.project.title) ? (opts.project.title + ' – Alfreelnc Design') : DEFAULT_ALT;

            // 1. Title Dokumen & Meta Standar (Bebas dari teks generik 'Cookie check')
            document.title = title;
            setAttr('meta[name="title"]', 'content', title);
            setAttr('meta[name="description"]', 'content', description);

            // 2. Canonical URL
            setAttr('canonical-url', 'href', url);

            // 3. Tag OpenGraph (WhatsApp, Facebook, LinkedIn, Telegram)
            setAttr('og-title', 'content', title);
            setAttr('og-desc', 'content', description);
            setAttr('og-url', 'content', url);
            setAttr('og-image', 'content', image);
            setAttr('og-image-secure', 'content', image);
            setAttr('og-image-alt', 'content', imageAlt);

            // 4. Tag Twitter / X Card
            setAttr('twitter-title', 'content', title);
            setAttr('twitter-desc', 'content', description);
            setAttr('twitter-image', 'content', image);
            setAttr('twitter-image-alt', 'content', imageAlt);
          } catch (err) {
            console.warn('Social meta update notice:', err);
          }
        };

        // Deteksi parameter URL (?project=ID_KARYA, ?p=ID, ?id=ID, atau /project/ID) SEBELUM halaman dirender
        try {
          var search = window.location.search || '';
          var pathname = window.location.pathname || '';
          var targetProjectId = null;

          if (search) {
            var match = search.match(/[?&](project|p|id)=([^&#]+)/i);
            if (match && match[2]) {
              targetProjectId = decodeURIComponent(match[2]);
            }
          }
          if (!targetProjectId && pathname.indexOf('/project/') !== -1) {
            var segs = pathname.split('/project/')[1];
            if (segs) targetProjectId = decodeURIComponent(segs.split('/')[0]);
          }

          if (targetProjectId) {
            var found = null;
            var storageKeys = ['user_projects', 'alfreelnc_cached_projects', 'projects_cache'];
            for (var k = 0; k < storageKeys.length; k++) {
              try {
                var stored = localStorage.getItem(storageKeys[k]);
                if (stored) {
                  var arr = JSON.parse(stored);
                  if (Array.isArray(arr)) {
                    found = arr.find(function(it) { return String(it.id) === String(targetProjectId); });
                    if (found) break;
                  }
                }
              } catch (e) {}
            }

            if (found) {
              window.__updateSocialMeta({
                title: found.title ? (found.title + ' – Alfreelnc Design Portofolio') : DEFAULT_TITLE,
                description: found.description || (found.category ? ('Karya desain grafis ' + found.category + ' oleh Alfreelnc Design') : DEFAULT_DESC),
                image: found.image || DEFAULT_IMG,
                project: found
              });
            } else {
              // Ambil langsung dari disk server (/api/projects) jika belum ada di localStorage
              fetch('/api/projects').then(function(res) { return res.json(); }).then(function(list) {
                if (Array.isArray(list)) {
                  var p = list.find(function(it) { return String(it.id) === String(targetProjectId); });
                  if (p) {
                    window.__updateSocialMeta({
                      title: p.title ? (p.title + ' – Alfreelnc Design Portofolio') : DEFAULT_TITLE,
                      description: p.description || (p.category ? ('Karya desain grafis ' + p.category + ' oleh Alfreelnc Design') : DEFAULT_DESC),
                      image: p.image || DEFAULT_IMG,
                      project: p
                    });
                  }
                }
              }).catch(function() {});
            }
          } else {
            // Halaman utama tanpa parameter proyek: pastikan menggunakan default setting brand & hero
            window.__updateSocialMeta();
          }
        } catch (e) {}
      })();
    </script>
