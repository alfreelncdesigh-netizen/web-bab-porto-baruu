    <!-- Dynamic Social Share & Canonical Metadata Resolver -->
    <script>
      (function() {
        // Resolve absolute URL helper
        function toAbsoluteUrl(path) {
          if (!path) return '';
          if (path.startsWith('http://') || path.startsWith('https://')) return path;
          var origin = window.location.origin || (window.location.protocol + '//' + window.location.host);
          var cleanPath = path.startsWith('/') ? path : '/' + path;
          return origin + cleanPath;
        }

        // Global dynamic metadata updater accessible by React and window events
        window.__updateSocialMeta = function(opts) {
          try {
            if (!opts) return;
            var origin = window.location.origin || '';
            var title = opts.title || 'Alfreelnc Design Portofolio';
            var description = opts.description || 'Kumpulan karya desain grafis, branding, dan informasi pemesanan jasa, kunjungi untuk info lebih lanjut .';
            var image = opts.image ? toAbsoluteUrl(opts.image) : toAbsoluteUrl('/images/promo_poster_1789471291192.jpg');
            var url = opts.url ? toAbsoluteUrl(opts.url) : (origin + window.location.pathname + window.location.hash);
            var imageAlt = opts.imageAlt || (title + ' – Pratinjau Visual');

            // Update document title
            document.title = title;

            // Update standard meta
            var metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) metaDesc.setAttribute('content', description);

            var metaTitle = document.querySelector('meta[name="title"]');
            if (metaTitle) metaTitle.setAttribute('content', title);

            // Update Canonical
            var linkCanon = document.getElementById('canonical-url');
            if (linkCanon) linkCanon.setAttribute('href', url);

            // Update OpenGraph
            var ogTitle = document.getElementById('og-title');
            if (ogTitle) ogTitle.setAttribute('content', title);

            var ogDesc = document.getElementById('og-desc');
            if (ogDesc) ogDesc.setAttribute('content', description);

            var ogUrl = document.getElementById('og-url');
            if (ogUrl) ogUrl.setAttribute('content', url);

            var ogImg = document.getElementById('og-image');
            if (ogImg) ogImg.setAttribute('content', image);

            var ogImgSec = document.getElementById('og-image-secure');
            if (ogImgSec) ogImgSec.setAttribute('content', image);

            var ogImgAlt = document.getElementById('og-image-alt');
            if (ogImgAlt) ogImgAlt.setAttribute('content', imageAlt);

            // Update Twitter
            var twTitle = document.getElementById('twitter-title');
            if (twTitle) twTitle.setAttribute('content', title);

            var twDesc = document.getElementById('twitter-desc');
            if (twDesc) twDesc.setAttribute('content', description);

            var twImg = document.getElementById('twitter-image');
            if (twImg) twImg.setAttribute('content', image);

            var twImgAlt = document.getElementById('twitter-image-alt');
            if (twImgAlt) twImgAlt.setAttribute('content', imageAlt);
          } catch (e) {
            console.warn('Social meta update error:', e);
          }
        };

        // Initialize absolute URLs on first load
        if (typeof window !== 'undefined') {
          var initialUrl = window.location.origin + window.location.pathname + window.location.hash;
          var canon = document.getElementById('canonical-url');
          if (canon) canon.setAttribute('href', initialUrl);
          var ogUrlTag = document.getElementById('og-url');
          if (ogUrlTag) ogUrlTag.setAttribute('content', initialUrl);
          var ogImgTag = document.getElementById('og-image');
          if (ogImgTag) {
            var curImg = ogImgTag.getAttribute('content');
            var absImg = toAbsoluteUrl(curImg);
            ogImgTag.setAttribute('content', absImg);
            var ogImgSecTag = document.getElementById('og-image-secure');
            if (ogImgSecTag) ogImgSecTag.setAttribute('content', absImg);
            var twImgTag = document.getElementById('twitter-image');
            if (twImgTag) twImgTag.setAttribute('content', absImg);
          }
        }
      })();
    </script>
